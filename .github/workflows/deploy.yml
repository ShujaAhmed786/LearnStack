name: Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_API_REPO: learnstack/api
  ECR_WEB_REPO: learnstack/web
  ECS_CLUSTER: learnstack
  ECS_API_SERVICE: learnstack-api
  ECS_WEB_SERVICE: learnstack-web

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        run: |
          docker build -f apps/api/Dockerfile -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPO }}:${{ steps.tag.outputs.tag }} -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPO }}:latest .
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPO }}:${{ steps.tag.outputs.tag }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPO }}:latest

      - name: Build and push Web image
        run: |
          docker build -f apps/web/Dockerfile -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_WEB_REPO }}:${{ steps.tag.outputs.tag }} -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_WEB_REPO }}:latest .
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_WEB_REPO }}:${{ steps.tag.outputs.tag }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_WEB_REPO }}:latest

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPO }}:${{ steps.tag.outputs.tag }}
          scanners: vuln # Only scan vulnerabilities, not secrets (placeholders trigger false positives)
          severity: CRITICAL,HIGH
          exit-code: 0 # Report only; .trivyignore documents suppressed transitive CVEs

      - name: Scan Web image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_WEB_REPO }}:${{ steps.tag.outputs.tag }}
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: 0 # Report only

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update API service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_API_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Update Web service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_WEB_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_API_SERVICE }} ${{ env.ECS_WEB_SERVICE }} \
            --region ${{ env.AWS_REGION }}

      - name: Smoke test
        run: |
          sleep 30
          curl -f https://app.shujaahmed.dev/health || exit 1
          echo "Smoke test passed"
