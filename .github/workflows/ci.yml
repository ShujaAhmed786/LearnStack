name: LearnStack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: shujaahmed786/learnstack

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter db --filter @learnstack/shared build
        continue-on-error: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api -t $REGISTRY/$IMAGE_PREFIX-api:${{ github.sha }} -t $REGISTRY/$IMAGE_PREFIX-api:latest .

      - name: Build Web image
        run: docker build -f infra/docker/Dockerfile.web -t $REGISTRY/$IMAGE_PREFIX-web:${{ github.sha }} -t $REGISTRY/$IMAGE_PREFIX-web:latest .

      - name: Trivy scan API
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Trivy scan Web
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: github.event_name == 'push'
        run: |
          docker push $REGISTRY/$IMAGE_PREFIX-api:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_PREFIX-api:latest
          docker push $REGISTRY/$IMAGE_PREFIX-web:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_PREFIX-web:latest
