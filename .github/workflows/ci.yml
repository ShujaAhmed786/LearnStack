name: LearnStack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: shujaahmed786/learnstack

jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 9
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm -r exec tsc --noEmit
    - run: pnpm -r exec eslint . --max-warnings=0

  build-scan-push:
    needs: typecheck-lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build API image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: infra/docker/Dockerfile.api
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
        push: true

    - name: Build Web image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: infra/docker/Dockerfile.web
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:latest
        push: true

    - name: Trivy scan API
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
        format: sarif
        output: trivy-api.sarif
        severity: CRITICAL,HIGH

    - name: Trivy scan Web
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:latest
        format: sarif
        output: trivy-web.sarif
        severity: CRITICAL,HIGH

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-api.sarif
