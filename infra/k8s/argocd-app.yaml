apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: learnstack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ShujaAhmed786/LearnStack.git
    targetRevision: HEAD
    path: infra/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: learnstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
