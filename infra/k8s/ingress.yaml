apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: learnstack
  namespace: learnstack
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: learnstack.yourdomain.com
    http:
      paths:
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: learnstack-api
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: learnstack-web
            port:
              number: 80
