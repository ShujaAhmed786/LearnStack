apiVersion: v1
kind: Namespace
metadata:
  name: learnstack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learnstack-api
  namespace: learnstack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learnstack-api
  template:
    metadata:
      labels:
        app: learnstack-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: ghcr.io/shujaahmed786/learnstack-api:latest
        ports:
        - containerPort: 3001
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: learnstack-secrets
              key: database-url
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: learnstack-secrets
              key: session-secret
        - name: CORS_ORIGIN
          value: "https://learnstack.yourdomain.com"
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: learnstack-api
  namespace: learnstack
spec:
  selector:
    app: learnstack-api
  ports:
  - port: 80
    targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learnstack-web
  namespace: learnstack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learnstack-web
  template:
    metadata:
      labels:
        app: learnstack-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: ghcr.io/shujaahmed786/learnstack-web:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: learnstack-web
  namespace: learnstack
spec:
  selector:
    app: learnstack-web
  ports:
  - port: 80
    targetPort: 8080
