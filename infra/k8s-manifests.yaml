apiVersion: v1
kind: Namespace
metadata:
  name: learnstack
---
apiVersion: v1
kind: Secret
metadata:
  name: learnstack-secrets
  namespace: learnstack
type: Opaque
stringData:
  DATABASE_URL: "postgresql://learnstack:LearnStack2026Secure!@10.1.2.181:5432/learnstack"
  JWT_SECRET: "learnstack-jwt-secret-change-in-production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learnstack-api
  namespace: learnstack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learnstack-api
  template:
    metadata:
      labels:
        app: learnstack-api
    spec:
      containers:
      - name: api
        image: ghcr.io/shujaahmed786/learnstack-api:latest
        ports:
        - containerPort: 3001
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: learnstack-secrets
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: learnstack-secrets
              key: JWT_SECRET
        - name: PORT
          value: "3001"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: learnstack-api
  namespace: learnstack
spec:
  selector:
    app: learnstack-api
  ports:
  - port: 3001
    targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learnstack-web
  namespace: learnstack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learnstack-web
  template:
    metadata:
      labels:
        app: learnstack-web
    spec:
      containers:
      - name: web
        image: ghcr.io/shujaahmed786/learnstack-web:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: learnstack-web
  namespace: learnstack
spec:
  selector:
    app: learnstack-web
  ports:
  - port: 80
    targetPort: 80
